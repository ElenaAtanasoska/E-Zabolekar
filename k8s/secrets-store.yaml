apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: dental-kv-provider
spec:
  provider: azure
  secretObjects:                
  - secretName: dental-db-secret 
    type: Opaque
    data:
    - objectName: db-password  # Ова мора да биде под 'data'
      key: password            # Ова мора да биде под '- objectName'
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "cdbf2f98-be2a-4fd4-aa99-f44c3c372eac" 
    keyvaultName: "dental-vault-2026"
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: secret-key
          objectType: secret
    tenantId: "f0cac47b-e2b3-4e1b-a52f-487d2d996288"